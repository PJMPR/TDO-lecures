name: space-fleet-demo
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: space_fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fleet", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
    environment:
      ConnectionStrings__FleetDb: Server=db;Port=3306;Database=space_fleet;User=fleet;Password=${MYSQL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql-data:

