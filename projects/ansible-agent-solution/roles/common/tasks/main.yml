- name: Wymagaj Ubuntu 24.04 na x86_64
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'
    fail_msg: Ten projekt obsługuje Ubuntu 24.04 x86_64.

- name: Zainstaluj pakiety bazowe
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

