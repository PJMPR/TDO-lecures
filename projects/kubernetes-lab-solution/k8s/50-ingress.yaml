apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-control
  namespace: mission-control
spec:
  ingressClassName: traefik
  rules:
    - host: mission.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

