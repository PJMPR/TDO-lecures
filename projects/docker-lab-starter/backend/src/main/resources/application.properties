spring.application.name=mission-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mission_control}
spring.datasource.username=${DB_USERNAME:mission}
spring.datasource.password=${DB_PASSWORD:mission}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}

