<main><header><div><small>MISSION CONTROL / LAB 01</small><h1>Rejestr misji</h1></div><span class="signal">API LINK</span></header><section class="form"><input [(ngModel)]="name" placeholder="Nazwa misji" aria-label="Nazwa misji"><select [(ngModel)]="status" aria-label="Status"><option>PLANNED</option><option>READY</option><option>ACTIVE</option><option>COMPLETED</option></select><input [(ngModel)]="launchDate" type="date" aria-label="Data startu"><button (click)="add()">Dodaj misję</button></section><p class="error" *ngIf="error">{{error}}</p><section class="missions"><article *ngFor="let mission of missions"><div><small>#{{mission.id}} · {{mission.status}}</small><h2>{{mission.name}}</h2><p>Start: {{mission.launchDate || 'nie ustalono'}}</p></div><button class="delete" (click)="remove(mission.id)" [attr.aria-label]="'Usuń '+mission.name">Usuń</button></article></section></main>
